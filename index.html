        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

            container.style.cssText = 'background:white;padding:12px;width:250px;border-radius:5px;';
            container.innerHTML = '<label for="districtSelect"><b>Pilih Distrik</b></label>' +
                '<select id="districtSelect" style="width:100%;padding:8px;margin-top:8px">' +
                '<option value="">Seluruh Papua</option></select>';
            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);
            return container;
        };
        districtControl.addTo(map);

        var districtFeatures = json_Kerentanan_Banjir_Papua_1.features;
        var districtSelect = document.getElementById('districtSelect');
        var districtGroups = {};

        districtFeatures.forEach(function (feature) {
            var kabupaten = feature.properties.Kab_Kota;
            if (!districtGroups[kabupaten]) districtGroups[kabupaten] = [];
            districtGroups[kabupaten].push(feature);
        });

        Object.keys(districtGroups).sort().forEach(function (kabupaten) {
            var group = document.createElement('optgroup');
            group.label = kabupaten;
            districtGroups[kabupaten].sort(function (a, b) {
                return a.properties.Kecamatan.localeCompare(b.properties.Kecamatan);
            }).forEach(function (feature) {
                var option = document.createElement('option');
                option.value = feature.properties.kode_dist;
                option.textContent = feature.properties.Kecamatan;
                group.appendChild(option);
            });
            districtSelect.appendChild(group);
        });

        // Highlight distrik.
        map.createPane('selectedDistrictPane');
        map.getPane('selectedDistrictPane').style.zIndex = 450;
        map.getPane('selectedDistrictPane').style.pointerEvents = 'none';
		map.getPane('selectedDistrictPane').style.filter = 
		'drop-shadow(0 0 4px #ffff00) drop-shadow(0 0 8px rgba(255,215,0,0.7))';
        var selectedDistrict = null;

        districtSelect.addEventListener('change', function () {
            if (selectedDistrict) {
                map.removeLayer(selectedDistrict);
                selectedDistrict = null;
            }
            if (!this.value) {
                map.fitBounds(layer_Kerentanan_Banjir_Papua_1.getBounds(), {
                    padding: [20, 20]
                });
                return;
            }

            var code = this.value;
            var feature = districtFeatures.find(function (item) {
                return String(item.properties.kode_dist) === code;
            });
            if (!feature) return;

            selectedDistrict = L.geoJSON(feature, {
                 pane: 'selectedDistrictPane',
    interactive: false,
    style: {
       color: '#ffffff',
    weight: 4,
    opacity: 1,
    fill: true,
    fillColor: '#ffea00',
    fillOpacity: 0.45,
    dashArray: '10, 6',
    lineCap: 'round',
    lineJoin: 'round'
                }
            }).addTo(map);

            map.fitBounds(selectedDistrict.getBounds(), {
                padding: [30, 30],
                maxZoom: 13
            });
        });
        setBounds();
        </script>        
    </body>
</html>
